name: Build specified commit

concurrency:
  group: "build"
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      commitSha:
        description: "Commit SHA to build."
        required: true
        type: string

      minecraftVersion:
        description: "Minecraft version this build targets."
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate commit SHA
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commitSha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::commitSha must be a Git commit SHA between 7 and 40 hexadecimal characters."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commitSha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Capture commit info and tag
        id: commit
        shell: bash
        env:
          MC_VERSION: ${{ inputs.minecraftVersion }}
        run: |
          sha="$(git rev-parse HEAD)"
          shortsha="$(git rev-parse --short=7 HEAD)"
          tag="build-mc${MC_VERSION}-${shortsha}"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "shortsha=$shortsha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build date
        id: prep
        shell: bash
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          
      - name: Configure dependency repositories
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/build-fixes.init.gradle" <<'EOF'
          allprojects {
              repositories {
                  exclusiveContent {
                      forRepository {
                          maven {
                              name = "Modrinth"
                              url = uri("https://api.modrinth.com/maven")
                          }
                      }

                      filter {
                          includeGroup("maven.modrinth")
                      }
                  }
              }

              configurations.configureEach {
                  resolutionStrategy.dependencySubstitution {
                      substitute module(
                          "maven.modrinth:lithium:mc1.21.1-0.14.0-beta.1"
                      ) using module(
                          "maven.modrinth:lithium:mc1.21.1-0.14.0-beta.1-fabric"
                      ) because(
                          "The original coordinate omits the Modrinth loader suffix"
                      )
                  }
              }
          }
          EOF

      - name: Build
        run: |
          ./gradlew build \
            --init-script "$RUNNER_TEMP/build-fixes.init.gradle" \
            --refresh-dependencies \
            -Pcommit=${{ steps.commit.outputs.sha }}
            
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.tag }}
          name: Meteor Client (MC ${{ inputs.minecraftVersion }}) — ${{ steps.commit.outputs.tag }}
          generate_release_notes: true
          files: build/libs/*
          body: |
            Automated Meteor build release
            - Requested commit: ${{ inputs.commitSha }}
            - Checked-out commit: ${{ steps.commit.outputs.sha }}
            - Minecraft version: ${{ inputs.minecraftVersion }}
            - Build date: ${{ steps.prep.outputs.build_date }}
